<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 80"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Train ARROW</title>
  <desc id="desc">Train stylisé orange circulant sur des rails noirs</desc>

  <!-- Fond transparent -->
  <rect width="400" height="80" fill="none"/>

  <!-- Rails -->
  <line x1="0" y1="58" x2="400" y2="58"
        stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <line x1="0" y1="66" x2="400" y2="66"
        stroke="#111111" stroke-width="4" stroke-linecap="round"/>

  <!-- Traverses -->
  <g fill="#111111">
    <rect x="20" y="56" width="10" height="14" rx="2"/>
    <rect x="60" y="56" width="10" height="14" rx="2"/>
    <rect x="100" y="56" width="10" height="14" rx="2"/>
    <rect x="140" y="56" width="10" height="14" rx="2"/>
    <rect x="180" y="56" width="10" height="14" rx="2"/>
    <rect x="220" y="56" width="10" height="14" rx="2"/>
    <rect x="260" y="56" width="10" height="14" rx="2"/>
    <rect x="300" y="56" width="10" height="14" rx="2"/>
    <rect x="340" y="56" width="10" height="14" rx="2"/>
  </g>

  <!-- Train (un wagon / motrice stylisée) -->
  <g id="train">
    <!-- Corps -->
    <rect x="40" y="26" width="120" height="28" rx="6" fill="#FF6A00"/>

    <!-- Nez avant -->
    <polygon points="160,26 185,32 185,54 160,54"
             fill="#FF6A00"/>

    <!-- Bande sombre bas -->
    <rect x="40" y="46" width="120" height="6" fill="#111111" opacity="0.35"/>

    <!-- Fenêtres -->
    <rect x="50" y="30" width="18" height="10" rx="2" fill="#FFFFFF"/>
    <rect x="72" y="30" width="18" height="10" rx="2" fill="#FFFFFF"/>
    <rect x="94" y="30" width="18" height="10" rx="2" fill="#FFFFFF"/>
    <rect x="116" y="30" width="18" height="10" rx="2" fill="#FFFFFF"/>

    <!-- Vitre frontale -->
    <polygon points="160,30 177,34 177,48 160,48"
             fill="#FFFFFF"/>

    <!-- Roues -->
    <circle cx="65" cy="68" r="6" fill="#111111"/>
    <circle cx="115" cy="68" r="6" fill="#111111"/>
    <circle cx="155" cy="68" r="6" fill="#111111"/>
  </g>
</svg>
