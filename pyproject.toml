[project]
name = "arow"
version = "0.1.0"
requires-python = ">=3.12"
description = "Advanced railway geolocation workflow"
readme = "README.md"
dependencies = [
    "faker==40.15.0",
    "folium==0.20.0",
    "geopandas==1.1.2",
    "loguru==0.7.3",
    "pandas==3.0.0",
    "pandera==0.31.1",
    "pyside6==6.10.1",
    "rich==14.2.0",
    "segno>=1.6.6",
    "shapely==2.1.2",
    "tenacity==9.1.4",
    "textual==8.2.3",
    "typer==0.24.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "black>=26.5.1",
    "isort>=8.0.1",
    "mypy>=1.20.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-qt>=4.5.0",
    "radon>=6.0.1",
    "ruff>=0.15.15",
]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
exclude = ["^src/__init__\\.py$"]

[[tool.mypy.overrides]]
module = [
    "gui.blocks.start.*",
    "gui.blocks.location.milestone_target",
]
disable_error_code = ["assignment", "attr-defined"]

[tool.bandit]
exclude_dirs = ["tests"]
