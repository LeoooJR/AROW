[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
exclude = ["^src/__init__\\.py$"]

[[tool.mypy.overrides]]
module = [
    "core.work.refresh_known_devices_work",
    "core.work.startup_work",
]
disable_error_code = ["union-attr", "assignment"]

[tool.bandit]
exclude_dirs = ["tests"]
